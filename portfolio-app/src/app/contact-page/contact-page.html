<div class="contact-container">
  <div class="header-section">
    <div class="header-text">
      <h1 class="page-title">Get In Touch</h1>
      <p class="subtitle">Looking forward to connecting with you</p>
    </div>
    
    <button class="btn primary download-btn" (click)="downloadResume()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>Download Resume</span>
    </button>
  </div>

  <div class="contact-grid">
    @for (info of contactInfo; track info.type) {
      <a [href]="info.link" target="_blank" rel="noopener noreferrer" class="contact-card">
        <div class="icon-wrapper">{{ info.icon }}</div>
        <div class="info-content">
          <h3 class="info-type">{{ info.type }}</h3>
          <p class="info-value">{{ info.value }}</p>
        </div>
      </a>
    }
  </div>
</div>
